<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برج الصحبة - إدارة العمارة السكنية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e293b',
                        secondary: '#0f172a',
                        accent: '#d97706',
                        accentLight: '#f59e0b',
                        lightBg: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

<div id="app-container" class="w-full max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[900px] border border-slate-800 relative">

    <!-- TOP APP HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white font-bold shadow-md shadow-amber-900/40">
                <i class="fa-solid fa-building"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight text-white">برج الصحبة</h1>
                <p class="text-xs text-amber-400 font-medium" id="header-user-badge">زائر</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 space-x-reverse">
            <button onclick="logout()" id="logout-btn" class="hidden text-xs bg-slate-800 hover:bg-red-600/20 text-red-400 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-power-off ml-1"></i> خروج
            </button>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 relative pb-20">
        <!-- يتم تعبئة المحتوى ديناميكياً -->
    </main>

    <!-- BOTTOM NAVIGATION BAR (ينشط فقط بعد تسجيل الدخول) -->
    <nav id="bottom-nav" class="hidden bg-slate-900 border-t border-slate-800 py-2 px-3 flex justify-around items-center z-20 shrink-0">
        <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-amber-400 text-xs" data-tab="home">
            <i class="fa-solid fa-house text-lg mb-0.5"></i>
            <span>الرئيسية</span>
        </button>
        <button onclick="switchTab('finances')" class="nav-btn flex flex-col items-center text-slate-400 text-xs" data-tab="finances">
            <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
            <span>المالية</span>
        </button>
        <button onclick="switchTab('apartments')" class="nav-btn flex flex-col items-center text-slate-400 text-xs" data-tab="apartments">
            <i class="fa-solid fa-building-user text-lg mb-0.5"></i>
            <span>الشقق</span>
        </button>
        <button onclick="switchTab('announcements')" class="nav-btn flex flex-col items-center text-slate-400 text-xs" data-tab="announcements">
            <i class="fa-solid fa-bullhorn text-lg mb-0.5"></i>
            <span>الإعلانات</span>
        </button>
        <button onclick="switchTab('doorkeeper')" class="nav-btn flex flex-col items-center text-slate-400 text-xs" data-tab="doorkeeper">
            <i class="fa-solid fa-user-tie text-lg mb-0.5"></i>
            <span>البواب</span>
        </button>
    </nav>
</div>

<!-- MODAL CONTAINER -->
<div id="modal-container" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"></div>

<script>
    // --- Application State ---
    let currentUser = JSON.parse(localStorage.getItem('borj_current_user')) || null;
    let currentTab = 'home';

    // Initialize clean data (بدون دُمي داتا قديمة)
    let db = JSON.parse(localStorage.getItem('borj_db')) || {
        apartments: [
            { id: 1, aptNo: '101', owner: 'أحمد كمال (أدمن)', phone: '01012345678', car: 'رقم أ ب ج 123', isRented: false, tenantName: '', tenantPhone: '', isAdmin: true, paidMonths: ['2026-06'] }
        ],
        expenses: [],
        revenues: [],
        duesConfig: { monthlyAmount: 200, currentMonth: '2026-06' },
        emergencyDues: [],
        announcements: [],
        doorkeeper: { name: 'عم سعيد', phone: '01111111111', nationalId: '29501011234567', emergencyPhone: '01222222222' }
    };

    function saveData() {
        localStorage.setItem('borj_db', JSON.stringify(db));
        localStorage.setItem('borj_current_user', JSON.stringify(currentUser));
    }

    // --- Authentication & Login Flow ---
    function renderAuthScreen() {
        const container = document.getElementById('main-content');
        document.getElementById('bottom-nav').classList.add('hidden');
        document.getElementById('logout-btn').classList.add('hidden');
        document.getElementById('header-user-badge').innerText = 'تسجيل الدخول';

        container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-center px-4">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white text-3xl font-bold shadow-xl shadow-amber-900/50 mb-6">
                    <i class="fa-solid fa-building-shield"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">برج الصحبة</h2>
                <p class="text-slate-400 text-sm mb-8">نظام إدارة العمارة السكنية الذكي</p>

                <div class="w-full space-y-4">
                    <button onclick="showLoginModal('admin')" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg shadow-amber-900/30 transition flex items-center justify-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-user-shield ml-2"></i>
                        <span>دخول المسؤول (الأدمن)</span>
                    </button>
                    <button onclick="showLoginModal('resident')" class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl border border-slate-700 transition flex items-center justify-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-house-user ml-2"></i>
                        <span>دخول الساكن</span>
                    </button>
                </div>
            </div>
        `;
    }

    function showLoginModal(role) {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-white">${role === 'admin' ? 'تسجيل دخول الأدمن' : 'تسجيل دخول الساكن'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleLogin(event, '${role}')" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">رقم الشقة (اسم المستخدم)</label>
                        <input type="text" id="login-apt" required placeholder="مثال: 101" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">رقم التليفون (كلمة المرور)</label>
                        <input type="password" id="login-pass" required placeholder="رقم الهاتف المسجل" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition">تسجيل الدخول</button>
                </form>
            </div>
        `;
    }

    function handleLogin(e, role) {
        e.preventDefault();
        const aptNo = document.getElementById('login-apt').value.trim();
        const pass = document.getElementById('login-pass').value.trim();

        if(role === 'admin') {
            const found = db.apartments.find(a => a.aptNo === aptNo && a.phone === pass && a.isAdmin);
            if(found) {
                currentUser = { aptNo: found.aptNo, role: 'admin', name: found.owner };
                saveData();
                closeModal();
                initApp();
            } else {
                alert('بيانات الأدمن غير صحيحة أو الشقة ليست مسجلة كأدمن!');
            }
        } else {
            const found = db.apartments.find(a => a.aptNo === aptNo && a.phone === pass);
            if(found) {
                currentUser = { aptNo: found.aptNo, role: 'resident', name: found.owner };
                saveData();
                closeModal();
                initApp();
            } else {
                alert('رقم الشقة أو رقم الهاتف غير صحيح!');
            }
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('borj_current_user');
        renderAuthScreen();
    }

    function closeModal() {
        document.getElementById('modal-container').classList.add('hidden');
    }

    // --- Main App & Navigation ---
    function initApp() {
        if(!currentUser) {
            renderAuthScreen();
            return;
        }
        document.getElementById('bottom-nav').classList.remove('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        document.getElementById('header-user-badge').innerText = `${currentUser.name} (${currentUser.role === 'admin' ? 'أدمن' : 'ساكن'})`;
        switchTab(currentTab);
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if(btn.dataset.tab === tab) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-amber-400');
            } else {
                btn.classList.remove('text-amber-400');
                btn.classList.add('text-slate-400');
            }
        });

        if(tab === 'home') renderHome();
        else if(tab === 'finances') renderFinances();
        else if(tab === 'apartments') renderApartments();
        else if(tab === 'announcements') renderAnnouncements();
        else if(tab === 'doorkeeper') renderDoorkeeper();
    }

    // --- HOME VIEW ---
    function renderHome() {
        const container = document.getElementById('main-content');
        const totalExpenses = db.expenses.reduce((sum, item) => sum + Number(item.amount), 0);
        const totalRevenues = db.revenues.reduce((sum, item) => sum + Number(item.amount), 0);
        const currentMonth = db.duesConfig.currentMonth;
        const unpaidApts = db.apartments.filter(a => !a.paidMonths.includes(currentMonth));

        container.innerHTML = `
            <div class="space-y-4">
                <!-- إعلان سريع من الأدمن -->
                <div class="bg-gradient-to-r from-amber-600/20 to-slate-900 border border-amber-500/30 rounded-2xl p-4">
                    <div class="flex items-center space-x-2 space-x-reverse text-amber-400 mb-1">
                        <i class="fa-solid fa-bullhorn"></i>
                        <span class="font-bold text-sm">تنبيه الإدارة العام</span>
                    </div>
                    <p class="text-xs text-slate-300">مرحباً بكم في نظام برج الصحبة. يرجى متابعة المصاريف والإعلانات أولاً بأول.</p>
                </div>

                <!-- الإحصائيات المالية المباشرة -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5">
                        <span class="text-xs text-slate-400 block mb-1">إجمالي المصروفات</span>
                        <h3 class="text-lg font-bold text-red-400">${totalExpenses} EGP</h3>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5">
                        <span class="text-xs text-slate-400 block mb-1">إجمالي الإيرادات</span>
                        <h3 class="text-lg font-bold text-emerald-400">${totalRevenues} EGP</h3>
                    </div>
                </div>

                <!-- الشقق المتأخرة (كليك لينك) -->
                <div onclick="showUnpaidModal()" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-2xl p-4 cursor-pointer transition flex items-center justify-between">
                    <div>
                        <span class="text-xs text-amber-400 font-medium block mb-1">الشقق المتأخرة عن شهر (${currentMonth})</span>
                        <h3 class="text-xl font-bold text-white">${unpaidApts.length} شقق لم تدفع</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
                        <i class="fa-solid fa-chevron-left"></i>
                    </div>
                </div>
            </div>
        `;
    }

    function showUnpaidModal() {
        const currentMonth = db.duesConfig.currentMonth;
        const unpaidApts = db.apartments.filter(a => !a.paidMonths.includes(currentMonth));
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-white">السكان المتأخرون عن شهر ${currentMonth}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2">
                    ${unpaidApts.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">جميع الشقق قامت بالسداد!</p>' : unpaidApts.map(a => `
                        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm text-white">شقة ${a.aptNo}</h4>
                                <p class="text-xs text-slate-400">${a.owner} - ${a.phone}</p>
                            </div>
                            ${currentUser.role === 'admin' ? `
                                <a href="https://wa.me/${a.phone}?text=مرحباً، نذكركم بسداد اشتراك عمارة برج الصحبة لشهر ${currentMonth}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center">
                                    <i class="fa-brands fa-whatsapp ml-1"></i> تذكير
                                </a>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // --- FINANCES VIEW ---
    function renderFinances() {
        const container = document.getElementById('main-content');
        container.innerHTML = `
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-base text-white">الإدارة المالية</h2>
                    ${currentUser.role === 'admin' ? `
                        <div class="space-x-2 space-x-reverse">
                            <button onclick="showAddExpenseModal()" class="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-lg">+ مصروف</button>
                            <button onclick="showAddEmergencyModal()" class="text-xs bg-slate-800 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-lg">+ بند طوارئ</button>
                        </div>
                    ` : ''}
                </div>

                <!-- المصروفات -->
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4">
                    <h3 class="font-bold text-sm text-amber-400 mb-3">سجل المصروفات</h3>
                    <div class="space-y-2">
                        ${db.expenses.length === 0 ? '<p class="text-xs text-slate-400 text-center py-2">لا توجد مصروفات مسجلة.</p>' : db.expenses.map((e, idx) => `
                            <div class="bg-slate-900/60 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-white block">${e.title}</span>
                                    <span class="text-slate-400 text-[10px]">تحت بند: ${e.category}</span>
                                </div>
                                <div class="flex items-center space-x-2 space-x-reverse">
                                    <span class="font-bold text-red-400">${e.amount} EGP</span>
                                    ${currentUser.role === 'admin' ? `<button onclick="deleteExpense(${idx})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- بنود الطوارئ والإيرادات -->
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4">
                    <h3 class="font-bold text-sm text-amber-400 mb-3">بنود الطوارئ المطلوبة</h3>
                    <div class="space-y-2">
                        ${db.emergencyDues.length === 0 ? '<p class="text-xs text-slate-400 text-center py-2">لا توجد بنود طوارئ إضافية.</p>' : db.emergencyDues.map((em, idx) => `
                            <div class="bg-slate-900/60 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-white block">${em.title}</span>
                                    <span class="text-amber-400 text-[10px]">مطلوب من كل شقة: ${em.amountPerApt} EGP</span>
                                </div>
                                ${currentUser.role === 'admin' ? `<button onclick="deleteEmergency(${idx})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function showAddExpenseModal() {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <h3 class="font-bold text-base text-white mb-3">إضافة مصروف جديد</h3>
                <form onsubmit="addExpense(event)" class="space-y-3">
                    <input type="text" id="exp-title" placeholder="عنوان المصروف (مثل: صيانة الأسانسير)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="text" id="exp-cat" placeholder="بند المصروف (مثل: صيانة)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="number" id="exp-amount" placeholder="المبلغ (EGP)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <div class="flex space-x-2 space-x-reverse pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">حفظ</button>
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs">إلغاء</button>
                    </div>
                </form>
            </div>
        `;
    }

    function addExpense(e) {
        e.preventDefault();
        db.expenses.push({
            title: document.getElementById('exp-title').value,
            category: document.getElementById('exp-cat').value,
            amount: document.getElementById('exp-amount').value
        });
        saveData();
        closeModal();
        renderFinances();
    }

    function deleteExpense(idx) {
        db.expenses.splice(idx, 1);
        saveData();
        renderFinances();
    }

    function showAddEmergencyModal() {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <h3 class="font-bold text-base text-white mb-3">إضافة بند إيراد طوارئ</h3>
                <form onsubmit="addEmergency(event)" class="space-y-3">
                    <input type="text" id="em-title" placeholder="سبب الطوارئ (مثل: تصليح ماسورة مياه)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="number" id="em-amount" placeholder="المطلوب من كل شقة (EGP)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <div class="flex space-x-2 space-x-reverse pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">إضافة</button>
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs">إلغاء</button>
                    </div>
                </form>
            </div>
        `;
    }

    function addEmergency(e) {
        e.preventDefault();
        db.emergencyDues.push({
            title: document.getElementById('em-title').value,
            amountPerApt: document.getElementById('em-amount').value
        });
        saveData();
        closeModal();
        renderFinances();
    }

    function deleteEmergency(idx) {
        db.emergencyDues.splice(idx, 1);
        saveData();
        renderFinances();
    }

    // --- APARTMENTS VIEW ---
    function renderApartments() {
        const container = document.getElementById('main-content');
        container.innerHTML = `
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-base text-white">شقق برج الصحبة</h2>
                    ${currentUser.role === 'admin' ? `<button onclick="showAddAptModal()" class="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-lg">+ إضافة شقة</button>` : ''}
                </div>
                <div class="space-y-3">
                    ${db.apartments.map((a, idx) => `
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-sm text-white">شقة ${a.aptNo}</h3>
                                    <p class="text-xs text-slate-300">المالك: ${a.owner} (${a.phone})</p>
                                    ${a.car ? `<p class="text-[11px] text-slate-400">السيارة: ${a.car}</p>` : ''}
                                </div>
                                <div class="flex items-center space-x-1 space-x-reverse">
                                    <span class="text-[10px] px-2 py-0.5 rounded-md ${a.isAdmin ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700 text-slate-300'}">
                                        ${a.isAdmin ? 'أدمن' : 'ساكن'}
                                    </span>
                                    ${currentUser.role === 'admin' ? `
                                        <button onclick="toggleAdminRole(${idx})" class="text-[10px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-0.5 rounded-md">تعديل الرول</button>
                                        <button onclick="deleteApt(${idx})" class="text-slate-500 hover:text-red-400 px-1"><i class="fa-solid fa-trash text-xs"></i></button>
                                    ` : ''}
                                </div>
                            </div>
                            ${a.isRented ? `
                                <div class="bg-slate-900/60 p-2 rounded-xl text-xs text-slate-300 border border-slate-800">
                                    <span class="text-amber-400 font-bold block mb-0.5">بيانات المستأجر:</span>
                                    <span>${a.tenantName} - ${a.tenantPhone}</span>
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function showAddAptModal() {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto">
                <h3 class="font-bold text-base text-white mb-3">إضافة شقة جديدة</h3>
                <form onsubmit="addApartment(event)" class="space-y-3 text-xs">
                    <input type="text" id="apt-no" placeholder="رقم الشقة (مثل: 102)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="apt-owner" placeholder="اسم المالك" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="apt-phone" placeholder="رقم تليفون المالك (كلمة المرور)" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="apt-car" placeholder="بيانات السيارة (اختياري)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    
                    <div class="flex items-center space-x-2 space-x-reverse pt-1">
                        <input type="checkbox" id="apt-rented" onchange="toggleTenantFields(this)">
                        <label for="apt-rented" class="text-slate-300">الشقة مؤجرة؟</label>
                    </div>

                    <div id="tenant-fields" class="hidden space-y-2 pt-1">
                        <input type="text" id="tenant-name" placeholder="اسم المستأجر" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                        <input type="text" id="tenant-phone" placeholder="تليفون المستأجر" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    </div>

                    <div class="flex space-x-2 space-x-reverse pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl font-bold">إضافة وإرسال رسالة واتساب</button>
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>
        `;
    }

    function toggleTenantFields(checkbox) {
        document.getElementById('tenant-fields').classList.toggle('hidden', !checkbox.checked);
    }

    function addApartment(e) {
        e.preventDefault();
        const aptNo = document.getElementById('apt-no').value;
        const owner = document.getElementById('apt-owner').value;
        const phone = document.getElementById('apt-phone').value;
        const car = document.getElementById('apt-car').value;
        const isRented = document.getElementById('apt-rented').checked;
        const tenantName = isRented ? document.getElementById('tenant-name').value : '';
        const tenantPhone = isRented ? document.getElementById('tenant-phone').value : '';

        db.apartments.push({ aptNo, owner, phone, car, isRented, tenantName, tenantPhone, isAdmin: false, paidMonths: [] });
        saveData();
        closeModal();
        renderApartments();

        // إرسال رسالة واتساب تلقائية ببيانات الدخول
        window.open(`https://wa.me/${phone}?text=مرحباً بك يا فندم في برج الصحبة. تم إنشاء حسابك لشقة ${aptNo}. اسم المستخدم: ${aptNo} وكلمة المرور: ${phone}`, '_blank');
    }

    function toggleAdminRole(idx) {
        db.apartments[idx].isAdmin = !db.apartments[idx].isAdmin;
        saveData();
        renderApartments();
    }

    function deleteApt(idx) {
        db.apartments.splice(idx, 1);
        saveData();
        renderApartments();
    }

    // --- ANNOUNCEMENTS VIEW ---
    function renderAnnouncements() {
        const container = document.getElementById('main-content');
        const pending = db.announcements.filter(an => !an.approved && currentUser.role === 'admin');
        const approved = db.announcements.filter(an => an.approved);

        container.innerHTML = `
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-base text-white">لوحة إعلانات العمارة</h2>
                    <button onclick="showAddAnnouncementModal()" class="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-lg">+ إضافة إعلان</button>
                </div>

                ${currentUser.role === 'admin' && pending.length > 0 ? `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 space-y-2">
                        <h3 class="font-bold text-xs text-amber-400">إعلانات بانتظار موافقتك (${pending.length})</h3>
                        ${pending.map((p, idx) => `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-white block">${p.title}</span>
                                    <span class="text-slate-400 text-[10px]">بواسطة شقة ${p.authorApt}</span>
                                </div>
                                <button onclick="approveAnnouncement(${p.id})" class="bg-emerald-600 text-white px-3 py-1 rounded-lg">موافقة ونشر</button>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <div class="space-y-3">
                    ${approved.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">لا توجد إعلانات منشورة حالياً.</p>' : approved.map(an => `
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-2">
                            <h3 class="font-bold text-sm text-white">${an.title}</h3>
                            <p class="text-xs text-slate-300">${an.content}</p>
                            ${an.image ? `<img src="${an.image}" class="w-full h-40 object-cover rounded-xl mt-2">` : ''}
                            <span class="text-[10px] text-slate-500 block text-left">نشر بواسطة: شقة ${an.authorApt}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function showAddAnnouncementModal() {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <h3 class="font-bold text-base text-white mb-3">نشر إعلان جديد</h3>
                <form onsubmit="addAnnouncement(event)" class="space-y-3 text-xs">
                    <input type="text" id="an-title" placeholder="عنوان الإعلان" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <textarea id="an-content" placeholder="تفاصيل الإعلان..." required rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white"></textarea>
                    <div>
                        <label class="block text-slate-400 mb-1">رابط صورة (اختياري)</label>
                        <input type="url" id="an-image" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    </div>
                    <div class="flex space-x-2 space-x-reverse pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl font-bold">إرسال للأدمن للموافقة</button>
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>
        `;
    }

    function addAnnouncement(e) {
        e.preventDefault();
        db.announcements.push({
            id: Date.now(),
            title: document.getElementById('an-title').value,
            content: document.getElementById('an-content').value,
            image: document.getElementById('an-image').value,
            authorApt: currentUser.aptNo,
            approved: currentUser.role === 'admin'
        });
        saveData();
        closeModal();
        renderAnnouncements();
        alert(currentUser.role === 'admin' ? 'تم نشر الإعلان بنجاح!' : 'تم إرسال الإعلان للأدمن للمراجعة والموافقة.');
    }

    function approveAnnouncement(id) {
        const an = db.announcements.find(a => a.id === id);
        if(an) { an.approved = true; saveData(); renderAnnouncements(); }
    }

    // --- DOORKEEPER VIEW ---
    function renderDoorkeeper() {
        const container = document.getElementById('main-content');
        const dk = db.doorkeeper;
        container.innerHTML = `
            <div class="space-y-4">
                <h2 class="font-bold text-base text-white">بيانات بواب العمارة</h2>
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3 text-xs">
                    <div class="flex items-center space-x-3 space-x-reverse mb-2">
                        <div class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-white">${dk.name}</h3>
                            <span class="text-slate-400">البواب المسؤول</span>
                        </div>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-xl space-y-2">
                        <p class="text-slate-300"><strong class="text-amber-400">رقم الهاتف:</strong> ${dk.phone}</p>
                        <p class="text-slate-300"><strong class="text-amber-400">الرقم القومي:</strong> ${dk.nationalId}</p>
                        <p class="text-slate-300"><strong class="text-amber-400">رقم الطوارئ (قريب):</strong> ${dk.emergencyPhone}</p>
                    </div>
                    ${currentUser.role === 'admin' ? `
                        <button onclick="showEditDoorkeeperModal()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition">تعديل بيانات البواب</button>
                    ` : ''}
                </div>
            </div>
        `;
    }

    function showEditDoorkeeperModal() {
        const dk = db.doorkeeper;
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <h3 class="font-bold text-base text-white mb-3">تعديل بيانات البواب</h3>
                <form onsubmit="saveDoorkeeper(event)" class="space-y-3 text-xs">
                    <input type="text" id="dk-name" value="${dk.name}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="dk-phone" value="${dk.phone}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="dk-nid" value="${dk.nationalId}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <input type="text" id="dk-ephone" value="${dk.emergencyPhone}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white">
                    <div class="flex space-x-2 space-x-reverse pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 text-white py-2 rounded-xl font-bold">حفظ التعديلات</button>
                        <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>
        `;
    }

    function saveDoorkeeper(e) {
        e.preventDefault();
        db.doorkeeper = {
            name: document.getElementById('dk-name').value,
            phone: document.getElementById('dk-phone').value,
            nationalId: document.getElementById('dk-nid').value,
            emergencyPhone: document.getElementById('dk-ephone').value
        };
        saveData();
        closeModal();
        renderDoorkeeper();
    }

    // Run Initial App Check
    initApp();
</script>
</body>
</html>
